[package]
name = "easygit"
version = "0.1.3"
description = "A customizable Git workspace"
authors = ["996wuxian"]
repository = "https://github.com/996wuxian/easygit"
homepage = "https://github.com/996wuxian/easygit"
edition = "2021"

[lib]
name = "easygit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }
