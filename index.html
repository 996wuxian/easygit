<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/esaygit-icon.png" />
    <link rel="preload" as="image" href="/brand/esaygit-wordmark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7e8ed" />
    <meta name="description" content="esaygit — 本地 Git 工作空间。" />
    <title>esaygit</title>
    <style>
      html,body { margin:0; background:#e7e8ed; }
      .boot-screen { position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#f5f5f7;color:#202226;font-family:'Segoe UI','Microsoft YaHei',sans-serif;transition:opacity .25s ease; }
      .boot-screen.leaving { opacity:0;pointer-events:none; }
      .boot-content { text-align:center; }
      .boot-mark { display:block;width:72px;height:72px;border-radius:19px;margin:auto; }
      .boot-wordmark { display:block;width:160px;height:auto;margin:13px auto 0; }
      .boot-track { margin:25px auto 16px;width:110px;height:2px;background:#e4e5e8;overflow:hidden;border-radius:3px; }
      .boot-track:after { content:'';display:block;width:44%;height:100%;background:#242528;border-radius:3px;animation:boot-progress 1.3s ease-in-out infinite; }
      #boot-status { font-size:11px;color:#93969d; }
      @keyframes boot-progress { from{transform:translateX(-105%)}to{transform:translateX(340%)} }
      @media(prefers-reduced-motion:reduce) { .boot-mark,.boot-track:after { animation:none; } }
    </style>
  </head>
  <body>
    <div id="app-loading" class="boot-screen" role="status" aria-live="polite">
      <div class="boot-content">
        <img class="boot-mark" src="/brand/esaygit-icon.png" alt="" />
        <img class="boot-wordmark" src="/brand/esaygit-wordmark.png" alt="esaygit" />
        <div class="boot-track"></div>
        <div id="boot-status">正在加载工作区</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>esaygit 需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
