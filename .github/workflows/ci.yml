name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    env:
      CARGO_HTTP_TIMEOUT: 120
      CARGO_NET_RETRY: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run test:release
      - run: npm run sync:version -- --check
      - run: npm run check
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test real Git workflows and native services
        working-directory: src-tauri
        run: cargo test --locked --lib -- --test-threads=4
